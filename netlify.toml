# Deploy juji-io/docs as juji-docs in this Netlify team before publishing.
# If its project name differs, update the .netlify.app URL below.
[[redirects]]
  from = "/docs/*"
  to = "https://juji-docs.netlify.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Keep these values in sync with the documentation edge function.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: *"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()"
